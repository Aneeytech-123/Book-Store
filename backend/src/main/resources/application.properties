spring.application.name=shelflife-bookstore
server.port=8080

# MongoDB connection (override with the MONGODB_URI environment variable)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/shelflife}
spring.data.mongodb.auto-index-creation=true

# Frontend origin allowed by CORS (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Login sessions expire after this many hours
app.auth.token-hours=24
